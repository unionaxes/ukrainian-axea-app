* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", Arial, sans-serif;
  color: #fff;
  height: 100vh;
  overflow: hidden;
  background: url("YOUR_IMAGE_URL_HERE") no-repeat center center fixed;
  background-size: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}

.content {
  text-align: center;
  backdrop-filter: blur(10px);
  background: rgba(0, 0, 0, 0.4);
  padding: 30px 20px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.25);
  width: 90%;
  max-width: 400px;
}

.logo {
  width: 120px;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(255, 200, 0, 0.6);
  margin-bottom: 10px;
}

h1 {
  font-size: 1.8em;
  margin: 10px 0;
  background: linear-gradient(90deg, #ffd800, #007bff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: #ccc;
  font-size: 0.9em;
  margin-bottom: 25px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-btn {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #007bff, #00bcd4);
  color: white;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
}

.menu-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 14px rgba(0, 123, 255, 0.8);
}

footer {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 0.8em;
  color: #bbb;
}
