<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ukrainian Axes — Кабинет</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif}
    body{
      / если картинка лежит в корне репозитория /
      background: url("IMG20251018135255_205.jpg") center/cover no-repeat fixed;
      background-color:#000;
      color:#fff;
      display:flex;align-items:center;justify-content:center;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,0.45);pointer-events:none}
    .card{position:relative;z-index:1;max-width:420px;width:92%;padding:28px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(0,0,0,0.15));box-shadow:0 8px 32px rgba(0,0,0,0.6);text-align:center}
    h1{margin:0 0 8px;font-size:22px;letter-spacing:1px}
    p{margin:0 0 16px;color:#ddd}
    .btn{display:inline-block;padding:10px 18px;border-radius:8px;background:#ff7a18;color:#111;font-weight:600;text-decoration:none;border:none;cursor:pointer}
    .small{font-size:13px;color:#bbb;margin-top:12px}
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Ukrainian Axes</h1>
    <p id="greet">Загрузка...</p>
    <div>
      <button class="btn" id="closeBtn">Закрыть</button>
    </div>
    <div class="small">Мини‑приложение Telegram Web App — откройте внутри клиента Telegram</div>
  </div>
<script>
  (function(){
    const tg = window.Telegram && window.Telegram.WebApp;
    const greetEl = document.getElementById('greet');
    const closeBtn = document.getElementById('closeBtn');
    if(!tg){
      greetEl.textContent = 'Откройте эту страницу внутри Telegram, чтобы увидеть профиль.';
      closeBtn.style.display = 'none';
      return;
    }
    tg.ready();
    const info = tg.initDataUnsafe || {};
    const user = info.user || {};
    const name = user.username ? '@'+user.username : (user.first_name || 'Игрок');
    greetEl.textContent = Привет, ${name}! Это ваш мини‑кабинет.;
    closeBtn.addEventListener('click', ()=>{ try{ tg.close(); }catch(e){} });
  })();
</script>
</body>
</html>
